name: Build Dream Cast TV v0.7.1 Debug (software + hardware AV1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    if: github.ref == 'refs/heads/develop'
    name: Debug ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: software_AV1
            flavor: softwareAv1
            player: software
          - variant: hardware_AV1
            flavor: hardwareAv1
            player: hardware

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Kotlin sources moved out of main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR=android/app/src/main/kotlin/com/dreamcast/app
          for file in MainActivity.kt CosmosAv1PlayerActivity.kt CosmosFmp4Resolver.kt CosmosMedia3Probe.kt; do
            if [[ -f "$SOURCE_DIR/$file" ]]; then
              echo "::error::Stale Kotlin source: $SOURCE_DIR/$file (delete from git)"
              exit 1
            fi
          done
          test -f android/app/src/softwareAv1/kotlin/com/dreamcast/app/MainActivity.kt
          test -f android/app/src/hardwareAv1/kotlin/com/dreamcast/app/MainActivity.kt
          echo 'Flavor Kotlin structure OK'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK (${{ matrix.variant }})
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor "${{ matrix.flavor }}" --dart-define=AV1_PLAYER=${{ matrix.player }}

      - name: Prepare output artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*${{ matrix.flavor }}*debug.apk' -print -quit)
          if [[ -z "$APK" ]]; then
            echo '::error::Flutter debug APK not found; output files:'
            ls -lah build/app/outputs/flutter-apk || true
            exit 1
          fi
          cp "$APK" "dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-debug.apk"
          sha256sum "dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-debug.apk" > "dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-debug.apk.sha256"

      - name: Upload Debug APK (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.7.1-${{ matrix.variant }}-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14
