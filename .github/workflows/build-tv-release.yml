name: Build Dream Cast TV Release APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v0.9.4 on GitHub Releases (main only)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: dreamcast-tv-release-main
  cancel-in-progress: false
jobs:
  verify:
    name: Check main and build tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check packaging scripts
        run: |
          python3 -m py_compile scripts/prepare_media3_dav1d.py scripts/decoder_license_notices.py scripts/audit_dav1d_apk.py scripts/audit_av1_apk.py
          python3 -m unittest discover -s scripts/tests -p 'test_media3_apk.py' -v
          bash scripts/tests/install_android_ndk_test.sh
  release:
    needs: verify
    name: Build signed v0.9.4 APK (Media3 + dav1d)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Checkout exact approved main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install pinned Android NDK
        run: bash scripts/install_android_ndk.sh
      - name: Verify source revision and native project
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f native-android/app/build.gradle.kts
          test -f native-android/app/src/main/AndroidManifest.xml
          test -f RELEASE_NOTES_v0.9.4.md
      - name: Prepare official release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing release-signing secret: $var"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > native-android/app/upload-keystore.jks
          {
            printf 'storeFile=app/upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > native-android/key.properties
          test -s native-android/app/upload-keystore.jks
      - name: Prepare dav1d ARM decoder
        run: |
          sdkmanager 'cmake;3.22.1'
          python3 -m pip install meson ninja
          python3 scripts/prepare_media3_dav1d.py --ndk "$ANDROID_HOME/ndk/$(cat .android-ndk-version)"
      - name: Test and lint native app
        run: >-
          bash native-android/gradlew -p native-android
          :app:testDebugUnitTest
          :app:lintRelease --console=plain
      - name: Build signed native Release APK
        run: >-
          bash native-android/gradlew -p native-android
          :app:assembleRelease --console=plain
      - name: Locate Release APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Missing signed Release APK: $APK"
            ls -lah native-android/app/build/outputs/apk/release || true
            exit 1
          fi
          DEST='dist/DreamCast-TV-v0.9.4-unified-release.apk'
          cp "$APK" "$DEST"
          (cd dist && sha256sum "$(basename "$DEST")" > "$(basename "$DEST").sha256")
          du -h "$DEST"
      - name: Validate release signature and Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/DreamCast-TV-v0.9.4-unified-release.apk'
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/signature-unified.txt
          "$AAPT" dump badging "$APK" | sed -n '1,4p' | tee dist/manifest-unified.txt
          python3 - "$APK" "$AAPT" <<'PYCODE'
          import re, subprocess, sys, zipfile
          apk, aapt = sys.argv[1:]
          out = subprocess.check_output([aapt, 'dump', 'badging', apk], text=True)
          m = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", out)
          assert m, 'Missing package metadata'
          assert m.group(1) == 'com.dreamcast.app', f'Unexpected package: {m.group(1)}'
          assert int(m.group(2)) == 904001, f'Unexpected version code: {m.group(2)}'
          assert m.group(3) == '0.9.4', f'Unexpected version name: {m.group(3)}'
          with zipfile.ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              abis = {n.split('/')[1] for n in libs}
              assert abis == {'armeabi-v7a', 'arm64-v8a'}, f'Unexpected native ABIs: {abis}'
          print('Release metadata, version and ARM ABIs: PASS')
          PYCODE
      - name: Audit packaged Release AV1 engines
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native-android/gradlew
          bash native-android/gradlew -p native-android :app:dependencies --configuration 'releaseRuntimeClasspath' --console=plain > av1-runtime-dependencies.txt
          python3 scripts/audit_av1_apk.py \
            --apk 'dist/DreamCast-TV-v0.9.4-unified-release.apk' \
            --dependencies av1-runtime-dependencies.txt \
            --player 'unified'
      - name: Upload Release audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.9.4-unified-release-audit
          path: |
            dist/av1-audit-*.txt
            dist/signature-*.txt
            dist/manifest-*.txt
            av1-runtime-dependencies.txt
            native-android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.9.4-unified-signed-release
          path: |
            dist/DreamCast-TV-v0.9.4-unified-release.apk
            dist/DreamCast-TV-v0.9.4-unified-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        shell: bash
        run: |
          rm -f native-android/key.properties native-android/app/upload-keystore.jks

  publish:
    name: Publish v0.9.4 on GitHub Releases
    needs: [release]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes from the selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified signed Release APK
        uses: actions/download-artifact@v4
        with:
          name: dreamcast-tv-v0.9.4-unified-signed-release
          path: dist
      - name: Validate release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main' || { echo '::error::Public release requires main'; exit 1; }
          cd dist
          test -s DreamCast-TV-v0.9.4-unified-release.apk
          test -s DreamCast-TV-v0.9.4-unified-release.apk.sha256
          sha256sum -c DreamCast-TV-v0.9.4-unified-release.apk.sha256
      - name: Verify certificate continuity against v0.7.0 and monotonic versionCode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          mkdir -p baseline
          gh release download v0.7.0 --repo "$GH_REPO" --dir baseline --pattern '*.apk'
          mapfile -t BASE_APKS < <(find baseline -maxdepth 1 -type f -iname '*.apk')
          if (( ${#BASE_APKS[@]} != 1 )); then
            echo "::error::Expected exactly one signed baseline v0.7.0 APK; found ${#BASE_APKS[@]}"
            exit 1
          fi
          baseline_apk="${BASE_APKS[0]}"
          "$APKSIGNER" verify "$baseline_apk"
          certificate_sha256() {
            local apk="$1"
            "$APKSIGNER" verify --print-certs "$apk" | python3 -c '
          import re, sys
          pattern = r"^(?:Signer #\d+|V\d+(?:\.\d+)? Signer):? certificate SHA-256 digest: ([0-9a-fA-F]{64})\s*$"
          values = {m.group(1).lower() for line in sys.stdin if (m := re.match(pattern, line.strip()))}
          if len(values) != 1:
              sys.exit(f"Expected exactly one unique certificate SHA-256, found {len(values)}")
          print(next(iter(values)))
          '
          }
          baseline_cert="$(certificate_sha256 "$baseline_apk")"
          baseline_code="$("$AAPT" dump badging "$baseline_apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          baseline_pkg="$("$AAPT" dump badging "$baseline_apk" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$baseline_cert" && test -n "$baseline_code"
          test "$baseline_pkg" = 'com.dreamcast.app'
          if (( 10#$baseline_code >= 904001 )); then
            echo "::error::v0.7.0 versionCode $baseline_code is not lower than 904001"
            exit 1
          fi
          apk='dist/DreamCast-TV-v0.9.4-unified-release.apk'
          "$APKSIGNER" verify "$apk"
          cert="$(certificate_sha256 "$apk")"
          if [[ -z "$cert" || "$cert" != "$baseline_cert" ]]; then
            echo '::error::Release signing certificate mismatch: unified APK versus v0.7.0'
            exit 1
          fi
          echo 'Signing certificate and upgrade versionCode validated for unified APK.'
      - name: Publish stable GitHub Release from approved main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.9.4 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo '::error::GitHub Release v0.9.4 already exists: refusing to overwrite it.'
            exit 1
          fi
          gh release create v0.9.4 \
            dist/DreamCast-TV-v0.9.4-unified-release.apk \
            dist/DreamCast-TV-v0.9.4-unified-release.apk.sha256 \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title 'Dream Cast TV v0.9.4' --notes-file RELEASE_NOTES_v0.9.4.md --latest
