name: Build Dream Cast TV Release APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish v0.8.5 on GitHub Releases (main only)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: dreamcast-tv-release-main
  cancel-in-progress: false
jobs:
  verify:
    name: Check main and build tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check packaging scripts
        run: |
          python3 -m py_compile scripts/prepare_software_av1.py scripts/audit_av1_apk.py scripts/package_libvlc_tv.py
          python3 -m unittest discover -s scripts/tests -p 'test_libvlc_tv.py' -v
          bash scripts/tests/install_android_ndk_test.sh
  libvlc_tv:
    name: Prepare reduced software player
    needs: verify
    uses: ./.github/workflows/build-libvlc-tv.yml
  release_v085:
    needs: libvlc_tv
    name: Release v0.8.5 (${{ matrix.variant }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: software_AV1
            flavor: softwareAv1
            player: software
          - variant: hardware_AV1
            flavor: hardwareAv1
            player: hardware
    steps:
      - name: Checkout exact approved main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Verify source revision and expected flavor sources
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main' || { echo '::error::Signing is permitted only on main'; exit 1; }
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || { echo '::error::Checkout revision mismatch'; exit 1; }
          test -f android/app/src/${{ matrix.flavor }}/kotlin/com/dreamcast/app/MainActivity.kt
          test -f scripts/audit_av1_apk.py
          test -f scripts/prepare_software_av1.py
          test -f third_party/video_player_android_noop/pubspec.yaml
          test -f android/app/build.gradle.kts
          test -f android/gradlew
          chmod +x android/gradlew
          for file in MainActivity.kt CosmosAv1PlayerActivity.kt CosmosFmp4Resolver.kt CosmosMedia3Probe.kt; do
            test ! -f "android/app/src/main/kotlin/com/dreamcast/app/$file" || {
              echo "::error::Duplicate shared Kotlin source: $file"; exit 1;
            }
          done
      - name: Prepare official release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing release-signing secret: $var"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=app/upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          test -s android/app/upload-keystore.jks
      - name: Select software-only no-op Android plugin
        if: matrix.player == 'software'
        run: python3 scripts/prepare_software_av1.py
      - name: Get dependencies
        run: flutter pub get
      - name: Download reduced LibVLC Maven repository
        if: matrix.player == 'software'
        uses: actions/download-artifact@v4
        with:
          name: libvlc-tv-maven
          path: .tools/libvlc-tv/maven
      - name: Install and verify Android NDK
        run: bash scripts/install_android_ndk.sh
      - name: Analyze Dart sources
        run: flutter analyze
      - name: Run regression tests
        run: flutter test
      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-shrink --flavor '${{ matrix.flavor }}' \
            --target-platform android-arm,android-arm64
      - name: Locate Release APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk"
          APK="$(printf '%s' "$APK" | tr '[:upper:]' '[:lower:]')"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Missing flavor Release APK: $APK"
            ls -lah build/app/outputs/flutter-apk || true
            exit 1
          fi
          DEST='dist/DreamCast-TV-v0.8.5-${{ matrix.variant }}-release.apk'
          cp "$APK" "$DEST"
          (cd dist && sha256sum "$(basename "$DEST")" > "$(basename "$DEST").sha256")
          du -h "$DEST"
      - name: Validate release signature and Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/DreamCast-TV-v0.8.5-${{ matrix.variant }}-release.apk'
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/signature-${{ matrix.player }}.txt
          "$AAPT" dump badging "$APK" | sed -n '1,4p' | tee dist/manifest-${{ matrix.player }}.txt
          python3 - "$APK" "$AAPT" <<'PYCODE'
          import re, subprocess, sys, zipfile
          apk, aapt = sys.argv[1:]
          out = subprocess.check_output([aapt, 'dump', 'badging', apk], text=True)
          m = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", out)
          assert m, 'Missing package metadata'
          assert m.group(1) == 'com.dreamcast.app', f'Unexpected package: {m.group(1)}'
          assert int(m.group(2)) == 805001, f'Unexpected version code: {m.group(2)}'
          assert m.group(3) == '0.8.5', f'Unexpected version name: {m.group(3)}'
          with zipfile.ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              abis = {n.split('/')[1] for n in libs}
              assert abis == {'armeabi-v7a', 'arm64-v8a'}, f'Unexpected native ABIs: {abis}'
          print('Release metadata, version and ARM ABIs: PASS')
          PYCODE
      - name: Audit packaged Release AV1 engines
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew :app:dependencies --configuration '${{ matrix.flavor }}ReleaseRuntimeClasspath' > ../av1-runtime-dependencies.txt)
          python3 scripts/audit_av1_apk.py \
            --apk 'dist/DreamCast-TV-v0.8.5-${{ matrix.variant }}-release.apk' \
            --dependencies av1-runtime-dependencies.txt \
            --player '${{ matrix.player }}'
      - name: Inspect packaged Release LibVLC size and debug sections
        if: matrix.player == 'software'
        shell: pwsh
        run: ./scripts/audit_libvlc_size.ps1 -Archive 'dist/DreamCast-TV-v0.8.5-${{ matrix.variant }}-release.apk' -Report 'dist/libvlc-size-release.json'
      - name: Upload Release audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.8.5-${{ matrix.variant }}-release-audit
          path: |
            dist/av1-audit-*.txt
            dist/signature-*.txt
            dist/manifest-*.txt
            dist/libvlc-size-*.json
            av1-runtime-dependencies.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.8.5-${{ matrix.variant }}-signed-release
          path: |
            dist/DreamCast-TV-v0.8.5-${{ matrix.variant }}-release.apk
            dist/DreamCast-TV-v0.8.5-${{ matrix.variant }}-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks

  publish_v085:
    name: Publish v0.8.5 on GitHub Releases
    needs: [release_v085]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes from the selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download both verified signed Release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: dreamcast-tv-v0.8.5-*-signed-release
          path: dist
          merge-multiple: true
      - name: Validate release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main' || { echo '::error::Public release requires main'; exit 1; }
          cd dist
          for variant in software_AV1 hardware_AV1; do
            test -s "DreamCast-TV-v0.8.5-${variant}-release.apk"
            test -s "DreamCast-TV-v0.8.5-${variant}-release.apk.sha256"
            sha256sum -c "DreamCast-TV-v0.8.5-${variant}-release.apk.sha256"
          done
      - name: Verify certificate continuity against v0.7.0 and monotonic versionCode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          mkdir -p baseline
          gh release download v0.7.0 --repo "$GH_REPO" --dir baseline --pattern '*.apk'
          mapfile -t BASE_APKS < <(find baseline -maxdepth 1 -type f -iname '*.apk')
          if (( ${#BASE_APKS[@]} != 1 )); then
            echo "::error::Expected exactly one signed baseline v0.7.0 APK; found ${#BASE_APKS[@]}"
            exit 1
          fi
          baseline_apk="${BASE_APKS[0]}"
          "$APKSIGNER" verify "$baseline_apk"
          certificate_sha256() {
            local apk="$1"
            "$APKSIGNER" verify --print-certs "$apk" | python3 -c '
          import re, sys
          pattern = r"^(?:Signer #\d+|V\d+(?:\.\d+)? Signer):? certificate SHA-256 digest: ([0-9a-fA-F]{64})\s*$"
          values = {m.group(1).lower() for line in sys.stdin if (m := re.match(pattern, line.strip()))}
          if len(values) != 1:
              sys.exit(f"Expected exactly one unique certificate SHA-256, found {len(values)}")
          print(next(iter(values)))
          '
          }
          baseline_cert="$(certificate_sha256 "$baseline_apk")"
          baseline_code="$("$AAPT" dump badging "$baseline_apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          baseline_pkg="$("$AAPT" dump badging "$baseline_apk" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$baseline_cert" && test -n "$baseline_code"
          test "$baseline_pkg" = 'com.dreamcast.app'
          if (( 10#$baseline_code >= 805001 )); then
            echo "::error::v0.7.0 versionCode $baseline_code is not lower than 805001"
            exit 1
          fi
          for variant in software_AV1 hardware_AV1; do
            apk="dist/DreamCast-TV-v0.8.5-${variant}-release.apk"
            "$APKSIGNER" verify "$apk"
            cert="$(certificate_sha256 "$apk")"
            if [[ -z "$cert" || "$cert" != "$baseline_cert" ]]; then
              echo "::error::Release signing certificate mismatch: $variant versus v0.7.0"
              exit 1
            fi
          done
          echo 'Signing certificate and upgrade versionCode validated for both flavors.'
      - name: Publish stable GitHub Release from approved main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.8.5 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo '::error::GitHub Release v0.8.5 already exists: refusing to overwrite it.'
            exit 1
          fi
          gh release create v0.8.5 \
            dist/DreamCast-TV-v0.8.5-software_AV1-release.apk \
            dist/DreamCast-TV-v0.8.5-software_AV1-release.apk.sha256 \
            dist/DreamCast-TV-v0.8.5-hardware_AV1-release.apk \
            dist/DreamCast-TV-v0.8.5-hardware_AV1-release.apk.sha256 \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title 'Dream Cast TV v0.8.5' --notes-file RELEASE_NOTES_v0.8.5.md --latest
