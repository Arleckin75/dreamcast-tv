name: Build unified Debug and Release APKs (develop)
on:
  workflow_dispatch:
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: dreamcast-tv-debug-develop
  cancel-in-progress: false
jobs:
  verify:
    name: Check develop and build tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop
        run: test "$GITHUB_REF" = 'refs/heads/develop'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check packaging scripts
        run: |
          python3 -m py_compile scripts/prepare_media3_dav1d.py scripts/decoder_license_notices.py scripts/audit_dav1d_apk.py scripts/audit_av1_apk.py
          python3 -m unittest discover -s scripts/tests -p 'test_media3_apk.py' -v
          bash scripts/tests/install_android_ndk_test.sh
  app:
    name: Build Media3 + dav1d Debug APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default includes the retired SDK package "tools".
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install pinned Android NDK
        run: bash scripts/install_android_ndk.sh
      - name: Prepare dav1d ARM decoder
        run: |
          sdkmanager 'cmake;3.22.1'
          python3 -m pip install meson ninja
          python3 scripts/prepare_media3_dav1d.py --ndk "$ANDROID_HOME/ndk/$(cat .android-ndk-version)"
      - name: Test and assemble unified Debug APK
        run: bash native-android/gradlew -p native-android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Inspect player dependencies and APK
        run: |
          bash native-android/gradlew -p native-android :app:dependencies --configuration debugRuntimeClasspath --console=plain > native-dependencies.txt
          python3 scripts/audit_av1_apk.py --apk native-android/app/build/outputs/apk/debug/app-debug.apk --dependencies native-dependencies.txt --player unified
      - name: Record APK checksum
        working-directory: native-android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-unified-debug
          path: |
            native-android/app/build/outputs/apk/debug/*.apk
            native-android/app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          retention-days: 14
      # Minified release, signed with the CI debug key. v0.9.3 shipped an R8
      # problem that only a release build shows; this catches it before main.
      - name: Lint and assemble minified Release APK
        run: bash native-android/gradlew -p native-android :app:lintRelease :app:assembleRelease -PreleaseDebugSigning=true --console=plain
      - name: Inspect Release dependencies and APK
        run: |
          bash native-android/gradlew -p native-android :app:dependencies --configuration releaseRuntimeClasspath --console=plain > native-release-dependencies.txt
          # The script always writes dist/av1-audit-unified.txt; keep both reports.
          mv dist/av1-audit-unified.txt dist/av1-audit-unified-debug.txt
          python3 scripts/audit_av1_apk.py --apk native-android/app/build/outputs/apk/release/app-release.apk --dependencies native-release-dependencies.txt --player unified
          mv dist/av1-audit-unified.txt dist/av1-audit-unified-release.txt
      - name: Record Release APK checksum
        working-directory: native-android/app/build/outputs/apk/release
        run: sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-unified-release-debugsigned
          path: |
            native-android/app/build/outputs/apk/release/*.apk
            native-android/app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dreamcast-tv-unified-develop-reports
          path: |
            native-android/app/build/reports/
            native-android/app/build/outputs/mapping/release/
            native-dependencies.txt
            native-release-dependencies.txt
            dist/av1-audit-*.txt
          if-no-files-found: ignore
          retention-days: 14
