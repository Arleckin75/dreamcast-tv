name: Build Dream Cast TV APK

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to build'
        required: true
        type: choice
        default: develop
        options:
          - develop
          - main

permissions:
  contents: read

jobs:
  debug_v070:
    name: Debug v0.7.0 (main)
    if: inputs.source_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build v0.7.0 Debug APK
        run: flutter build apk --debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.7.0-main-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  debug_v071:
    name: Debug v0.7.1 (${{ matrix.variant }})
    if: inputs.source_branch == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: software_AV1
            flavor: softwareAv1
            player: software
          - variant: hardware_AV1
            flavor: hardwareAv1
            player: hardware
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify flavor-specific Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR=android/app/src/main/kotlin/com/dreamcast/app
          for file in MainActivity.kt CosmosAv1PlayerActivity.kt CosmosFmp4Resolver.kt CosmosMedia3Probe.kt; do
            if [[ -f "$SOURCE_DIR/$file" ]]; then
              echo "::error::Stale Kotlin source: $SOURCE_DIR/$file"
              exit 1
            fi
          done
          test -f android/app/src/softwareAv1/kotlin/com/dreamcast/app/MainActivity.kt
          test -f android/app/src/hardwareAv1/kotlin/com/dreamcast/app/MainActivity.kt
      - name: Get dependencies
        run: flutter pub get
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor "${{ matrix.flavor }}" --dart-define="AV1_PLAYER=${{ matrix.player }}"
      - name: Prepare named APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk"
          # Flutter lowercases flavor names in generated APK filenames.
          APK="$(printf '%s' "$APK" | tr '[:upper:]' '[:lower:]')"
          if [[ ! -s "$APK" ]]; then
            echo '::error::Flavor APK not found:'
            ls -lah build/app/outputs/flutter-apk || true
            exit 1
          fi
          OUTPUT="dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-debug.apk"
          cp "$APK" "$OUTPUT"
          (cd dist && sha256sum "$(basename "$OUTPUT")" > "$(basename "$OUTPUT").sha256")
      - name: Upload flavor Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.7.1-${{ matrix.variant }}-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14
