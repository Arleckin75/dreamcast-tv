name: Build Dream Cast TV APK

on:
  workflow_call:
    inputs:
      build_mode:
        type: string
        default: debug
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified release (main only)'
        type: boolean
        default: false
      build_mode:
        description: 'Build mode'
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: dreamcast-tv-${{ github.ref }}-${{ inputs.build_mode }}
  cancel-in-progress: false

jobs:
  debug_v071:
    name: Debug v0.7.1 (${{ matrix.variant }})
    if: inputs.build_mode == 'debug' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: software_AV1
            flavor: softwareAv1
            player: software
          - variant: hardware_AV1
            flavor: hardwareAv1
            player: hardware
    steps:
      - name: Checkout exact selected branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Verify flavor-specific Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          SOURCE_DIR=android/app/src/main/kotlin/com/dreamcast/app
          for file in MainActivity.kt CosmosAv1PlayerActivity.kt CosmosFmp4Resolver.kt CosmosMedia3Probe.kt; do
            if [[ -f "$SOURCE_DIR/$file" ]]; then
              echo "::error::Stale Kotlin source: $SOURCE_DIR/$file"
              exit 1
            fi
          done
          test -f android/app/src/softwareAv1/kotlin/com/dreamcast/app/MainActivity.kt
          test -f android/app/src/hardwareAv1/kotlin/com/dreamcast/app/MainActivity.kt
      - name: Select LibVLC-only Flutter plugin (software_AV1)
        if: matrix.player == 'software'
        run: python3 scripts/prepare_software_av1.py
      - name: Get dependencies
        run: flutter pub get
      - name: Install and verify Android NDK
        run: bash scripts/install_android_ndk.sh
      - name: Analyze Dart sources
        run: flutter analyze
      - name: Run regression tests
        run: flutter test
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.player }}" == "software" ]]; then
            # Don't package Flutter x86_64 artifacts in the software AV1 build.
            flutter build apk --debug --flavor "${{ matrix.flavor }}" \
              --target-platform android-arm,android-arm64
          else
            flutter build apk --debug --flavor "${{ matrix.flavor }}" \
              --target-platform android-arm,android-arm64
          fi
      - name: Prepare named APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk"
          # Flutter lowercases flavor names in generated APK filenames.
          APK="$(printf '%s' "$APK" | tr '[:upper:]' '[:lower:]')"
          if [[ ! -s "$APK" ]]; then
            echo '::error::Flavor APK not found:'
            ls -lah build/app/outputs/flutter-apk || true
            exit 1
          fi
          OUTPUT="dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-debug.apk"
          cp "$APK" "$OUTPUT"
          (cd dist && sha256sum "$(basename "$OUTPUT")" > "$(basename "$OUTPUT").sha256")
      - name: Verify packaged APK excludes x86 ABIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          apk = Path('dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-debug.apk')
          with zipfile.ZipFile(apk) as z:
              native = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              abis = sorted({n.split('/')[1] for n in native})
              print('Native ABIs:', ', '.join(abis))
              forbidden = {'x86', 'x86_64'} & set(abis)
              if forbidden:
                  raise SystemExit('::error::Unexpected x86 libraries in AV1 APK: ' + ', '.join(sorted(forbidden)))
              required = {'armeabi-v7a', 'arm64-v8a'}
              if not required.issubset(abis):
                  raise SystemExit('::error::Required ARM ABIs missing: ' + ', '.join(sorted(required - set(abis))))
          PYCODE
      - name: Audit packaged AV1 players
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew :app:dependencies --configuration "${{ matrix.flavor }}DebugRuntimeClasspath" > ../av1-runtime-dependencies.txt)
          python3 scripts/audit_av1_apk.py \
            --apk "dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-debug.apk" \
            --dependencies av1-runtime-dependencies.txt \
            --player "${{ matrix.player }}"
      - name: Upload AV1 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.7.1-${{ matrix.variant }}-audit
          path: |
            dist/av1-audit-*.txt
            av1-runtime-dependencies.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload flavor Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.7.1-${{ matrix.variant }}-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release_v071:
    name: Release v0.7.1 (${{ matrix.variant }})
    if: inputs.build_mode == 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: software_AV1
            flavor: softwareAv1
            player: software
          - variant: hardware_AV1
            flavor: hardwareAv1
            player: hardware
    steps:
      - name: Checkout exact approved main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Verify source revision and expected flavor sources
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main' || { echo '::error::Signing is permitted only on main'; exit 1; }
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || { echo '::error::Checkout revision mismatch'; exit 1; }
          test -f android/app/src/${{ matrix.flavor }}/kotlin/com/dreamcast/app/MainActivity.kt
          test -f scripts/audit_av1_apk.py
          test -f scripts/prepare_software_av1.py
          test -f third_party/video_player_android_noop/pubspec.yaml
          test -f android/app/build.gradle.kts
          test -f android/gradlew
          chmod +x android/gradlew
          for file in MainActivity.kt CosmosAv1PlayerActivity.kt CosmosFmp4Resolver.kt CosmosMedia3Probe.kt; do
            test ! -f "android/app/src/main/kotlin/com/dreamcast/app/$file" || {
              echo "::error::Duplicate shared Kotlin source: $file"; exit 1;
            }
          done
      - name: Prepare official release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing release-signing secret: $var"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=app/upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          test -s android/app/upload-keystore.jks
      - name: Select software-only no-op Android plugin
        if: matrix.player == 'software'
        run: python3 scripts/prepare_software_av1.py
      - name: Get dependencies
        run: flutter pub get
      - name: Install and verify Android NDK
        run: bash scripts/install_android_ndk.sh
      - name: Analyze Dart sources
        run: flutter analyze
      - name: Run regression tests
        run: flutter test
      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-shrink --flavor '${{ matrix.flavor }}' \
            --target-platform android-arm,android-arm64
      - name: Locate Release APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk"
          APK="$(printf '%s' "$APK" | tr '[:upper:]' '[:lower:]')"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Missing flavor Release APK: $APK"
            ls -lah build/app/outputs/flutter-apk || true
            exit 1
          fi
          DEST='dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-release.apk'
          cp "$APK" "$DEST"
          (cd dist && sha256sum "$(basename "$DEST")" > "$(basename "$DEST").sha256")
          du -h "$DEST"
      - name: Validate release signature and Android metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-release.apk'
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/signature-${{ matrix.player }}.txt
          "$AAPT" dump badging "$APK" | sed -n '1,4p' | tee dist/manifest-${{ matrix.player }}.txt
          python3 - "$APK" "$AAPT" <<'PYCODE'
          import re, subprocess, sys, zipfile
          apk, aapt = sys.argv[1:]
          out = subprocess.check_output([aapt, 'dump', 'badging', apk], text=True)
          m = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", out)
          assert m, 'Missing package metadata'
          assert m.group(1) == 'com.dreamcast.app', f'Unexpected package: {m.group(1)}'
          assert int(m.group(2)) == 710001, f'Unexpected version code: {m.group(2)}'
          assert m.group(3) == '0.7.1', f'Unexpected version name: {m.group(3)}'
          with zipfile.ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              abis = {n.split('/')[1] for n in libs}
              assert abis == {'armeabi-v7a', 'arm64-v8a'}, f'Unexpected native ABIs: {abis}'
          print('Release metadata, version and ARM ABIs: PASS')
          PYCODE
      - name: Audit packaged Release AV1 engines
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew :app:dependencies --configuration '${{ matrix.flavor }}ReleaseRuntimeClasspath' > ../av1-runtime-dependencies.txt)
          python3 scripts/audit_av1_apk.py \
            --apk 'dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-release.apk' \
            --dependencies av1-runtime-dependencies.txt \
            --player '${{ matrix.player }}'
      - name: Upload Release audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.7.1-${{ matrix.variant }}-release-audit
          path: |
            dist/av1-audit-*.txt
            dist/signature-*.txt
            dist/manifest-*.txt
            av1-runtime-dependencies.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-tv-v0.7.1-${{ matrix.variant }}-signed-release
          path: |
            dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-release.apk
            dist/DreamCast-TV-v0.7.1-${{ matrix.variant }}-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks

  publish_v071:
    name: Publish v0.7.1 on GitHub Releases
    needs: [release_v071]
    if: inputs.build_mode == 'release' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download both verified signed Release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: dreamcast-tv-v0.7.1-*-signed-release
          path: dist
          merge-multiple: true
      - name: Validate release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main' || { echo '::error::Public release requires main'; exit 1; }
          cd dist
          for variant in software_AV1 hardware_AV1; do
            test -s "DreamCast-TV-v0.7.1-${variant}-release.apk"
            test -s "DreamCast-TV-v0.7.1-${variant}-release.apk.sha256"
            sha256sum -c "DreamCast-TV-v0.7.1-${variant}-release.apk.sha256"
          done
      - name: Verify certificate continuity against v0.7.0 and monotonic versionCode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          mkdir -p baseline
          gh release download v0.7.0 --repo "$GH_REPO" --dir baseline --pattern '*.apk'
          mapfile -t BASE_APKS < <(find baseline -maxdepth 1 -type f -iname '*.apk')
          if (( ${#BASE_APKS[@]} != 1 )); then
            echo "::error::Expected exactly one signed baseline v0.7.0 APK; found ${#BASE_APKS[@]}"
            exit 1
          fi
          baseline_apk="${BASE_APKS[0]}"
          "$APKSIGNER" verify "$baseline_apk"
          baseline_cert="$("$APKSIGNER" verify --print-certs "$baseline_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          baseline_code="$("$AAPT" dump badging "$baseline_apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          baseline_pkg="$("$AAPT" dump badging "$baseline_apk" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$baseline_cert" && test -n "$baseline_code"
          test "$baseline_pkg" = 'com.dreamcast.app'
          if (( 10#$baseline_code >= 710001 )); then
            echo "::error::v0.7.0 versionCode $baseline_code is not lower than 710001"
            exit 1
          fi
          for variant in software_AV1 hardware_AV1; do
            apk="dist/DreamCast-TV-v0.7.1-${variant}-release.apk"
            "$APKSIGNER" verify "$apk"
            cert="$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
            if [[ -z "$cert" || "$cert" != "$baseline_cert" ]]; then
              echo "::error::Release signing certificate mismatch: $variant versus v0.7.0"
              exit 1
            fi
          done
          echo 'Signing certificate and upgrade versionCode validated for both flavors.'
      - name: Publish stable GitHub Release from approved main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.7.1 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo '::error::GitHub Release v0.7.1 already exists: refusing to overwrite it.'
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          # Dream Cast TV v0.7.1

          Two separate Android TV builds (install **one**):

          - **software_AV1** — LibVLC software AV1 decoding; intended for Cosmos TV and other devices without hardware AV1 decoding.
          - **hardware_AV1** — ExoPlayer / Media3; intended for devices with hardware AV1 decoding.

          Both APKs use `com.dreamcast.app`, support ARMv7 and ARM64 and are signed with the existing release certificate. They cannot be installed side by side.

          ## Changes
          - Four video quality choices: Auto, 480p, 720p and 1080p.
          - Separate player dependencies, without automatic player fallback.
          - Fix LibVLC exit crashes on Cosmos TV and restore playback progress/resume.
          - Exclude x86/x86_64 native libraries.

          SHA-256 files are included for both APKs.
          NOTES
          gh release create v0.7.1 \
            dist/DreamCast-TV-v0.7.1-software_AV1-release.apk \
            dist/DreamCast-TV-v0.7.1-software_AV1-release.apk.sha256 \
            dist/DreamCast-TV-v0.7.1-hardware_AV1-release.apk \
            dist/DreamCast-TV-v0.7.1-hardware_AV1-release.apk.sha256 \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title 'Dream Cast TV v0.7.1' --notes-file release-notes.md --latest
