name: Build reduced TV LibVLC
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache_lookup:
    name: Reuse verified TV AAR when sources are unchanged
    runs-on: ubuntu-24.04
    outputs:
      hit: ${{ steps.aar-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: aar-cache
        with:
          path: dist/libvlc-tv-maven
          key: libvlc-tv-maven-${{ hashFiles('.github/workflows/build-libvlc-tv.yml', 'scripts/*libvlc*', 'third_party/libvlc_tv/**') }}
      - uses: actions/upload-artifact@v4
        if: steps.aar-cache.outputs.cache-hit == 'true'
        with:
          name: libvlc-tv-maven
          path: dist/libvlc-tv-maven
          if-no-files-found: error
          retention-days: 14
  native:
    needs: cache_lookup
    if: needs.cache_lookup.outputs.hit != 'true'
    name: LibVLC TV (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            image: registry.videolan.org/vlc-debian-android-3.0:20260701183656
          - abi: arm64-v8a
            image: registry.videolan.org/vlc-debian-android:20260611225331
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: dist/libvlc-tv/native
          key: libvlc-tv-${{ matrix.abi }}-${{ hashFiles('.github/workflows/build-libvlc-tv.yml', 'scripts/build_libvlc_tv.sh', 'third_party/libvlc_tv/**') }}
      - name: Build native TV library from pinned sources
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_libvlc_tv.sh '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v4
        with:
          name: libvlc-tv-native-${{ matrix.abi }}
          path: dist/libvlc-tv/native
          if-no-files-found: error
          retention-days: 14
  package:
    name: Verify reduction and package TV AAR
    needs: [cache_lookup, native]
    if: always() && needs.cache_lookup.result == 'success' && needs.cache_lookup.outputs.hit != 'true' && needs.native.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: libvlc-tv-native-*
          path: .tools/libvlc-tv/native
          merge-multiple: true
      - name: Download the checksum-pinned original Java bindings
        shell: bash
        run: |
          set -euo pipefail
          source third_party/libvlc_tv/versions.env
          mkdir -p .tools/libvlc-tv/baseline
          base="https://repo.maven.apache.org/maven2/org/videolan/android/libvlc-all/$BASELINE_VERSION/libvlc-all-$BASELINE_VERSION"
          curl --fail --location --retry 3 "$base.aar" -o .tools/libvlc-tv/baseline/original.aar
          curl --fail --location --retry 3 "$base.pom" -o .tools/libvlc-tv/baseline/original.pom
          echo "$BASELINE_SHA256  .tools/libvlc-tv/baseline/original.aar" | sha256sum -c -
      - name: Package custom AAR and require smaller ARM libvlc.so
        run: >-
          python3 scripts/package_libvlc_tv.py
          --baseline .tools/libvlc-tv/baseline/original.aar
          --pom .tools/libvlc-tv/baseline/original.pom
          --native-dir .tools/libvlc-tv/native
          --output dist/libvlc-tv-maven
      - uses: actions/cache/save@v4
        with:
          path: dist/libvlc-tv-maven
          key: libvlc-tv-maven-${{ hashFiles('.github/workflows/build-libvlc-tv.yml', 'scripts/*libvlc*', 'third_party/libvlc_tv/**') }}
      - uses: actions/upload-artifact@v4
        with:
          name: libvlc-tv-maven
          path: dist/libvlc-tv-maven
          if-no-files-found: error
          retention-days: 14
